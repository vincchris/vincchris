<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 200" width="220" height="200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- shadow -->
  <ellipse cx="105" cy="183" rx="58" ry="8" fill="#6B4F3A" opacity="0.10"/>

  <!-- wagging tail -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-14 148 135;16 148 135;-14 148 135" dur="0.5s" repeatCount="indefinite"/>
    <path d="M148 135 Q172 128 174 104" fill="none" stroke="#E8A765" stroke-width="13" stroke-linecap="round"/>
  </g>

  <!-- body -->
  <ellipse cx="105" cy="140" rx="46" ry="33" fill="#F2B97C"/>
  <ellipse cx="105" cy="152" rx="28" ry="19" fill="#FFF1DE"/>

  <!-- back feet -->
  <ellipse cx="64" cy="177" rx="11" ry="6" fill="#E8A765"/>
  <ellipse cx="146" cy="177" rx="11" ry="6" fill="#E8A765"/>

  <!-- front legs -->
  <rect x="78" y="158" width="17" height="22" rx="8.5" fill="#F2B97C"/>
  <rect x="115" y="158" width="17" height="22" rx="8.5" fill="#F2B97C"/>
  <ellipse cx="86.5" cy="178" rx="10" ry="5" fill="#FFF1DE"/>
  <ellipse cx="123.5" cy="178" rx="10" ry="5" fill="#FFF1DE"/>

  <!-- head (bobbing) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="1.2s" repeatCount="indefinite"/>

    <!-- floppy ears -->
    <ellipse cx="62" cy="72" rx="13" ry="25" transform="rotate(20 62 72)" fill="#D9955A"/>
    <ellipse cx="138" cy="72" rx="13" ry="25" transform="rotate(-20 138 72)" fill="#D9955A"/>

    <!-- face -->
    <circle cx="100" cy="90" r="40" fill="#F2B97C"/>
    <ellipse cx="100" cy="103" rx="25" ry="20" fill="#FFF1DE"/>

    <!-- brow dots -->
    <circle cx="84" cy="77" r="2.5" fill="#D9955A"/>
    <circle cx="116" cy="77" r="2.5" fill="#D9955A"/>

    <!-- eyes (blink) -->
    <ellipse cx="84" cy="88" rx="5" ry="5.5" fill="#4A3426">
      <animate attributeName="ry" values="5.5;5.5;0.6;5.5;5.5" keyTimes="0;0.9;0.94;0.98;1" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="116" cy="88" rx="5" ry="5.5" fill="#4A3426">
      <animate attributeName="ry" values="5.5;5.5;0.6;5.5;5.5" keyTimes="0;0.9;0.94;0.98;1" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="85.8" cy="86" r="1.8" fill="#fff"/>
    <circle cx="117.8" cy="86" r="1.8" fill="#fff"/>

    <!-- blush -->
    <circle cx="73" cy="100" r="6" fill="#FF9EB1" opacity="0.55"/>
    <circle cx="127" cy="100" r="6" fill="#FF9EB1" opacity="0.55"/>

    <!-- tongue -->
    <path d="M95 108 Q100 124 105 108 Z" fill="#FF8FA3"/>

    <!-- nose + mouth -->
    <ellipse cx="100" cy="98" rx="6.5" ry="4.5" fill="#4A3426"/>
    <ellipse cx="98" cy="96.5" rx="1.8" ry="1" fill="#fff" opacity="0.7"/>
    <path d="M100 102 V107 M100 107 Q93 114 87 107 M100 107 Q107 114 113 107" fill="none" stroke="#4A3426" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- collar -->
    <path d="M68 124 Q100 142 132 124" fill="none" stroke="#FF8FA3" stroke-width="6" stroke-linecap="round"/>
    <circle cx="100" cy="137" r="4.5" fill="#FFD166"/>
  </g>

  <!-- floating hearts -->
  <g fill="#FF8FA3" opacity="0">
    <animateTransform attributeName="transform" type="translate" values="168 70;168 38" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="2.4s" repeatCount="indefinite"/>
    <path d="M0 3 C-8 -4 -14 4 0 14 C14 4 8 -4 0 3 Z" transform="scale(0.8)"/>
  </g>
  <g fill="#FFB3C6" opacity="0">
    <animateTransform attributeName="transform" type="translate" values="38 64;38 34" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    <path d="M0 3 C-8 -4 -14 4 0 14 C14 4 8 -4 0 3 Z" transform="scale(0.6)"/>
  </g>
</svg>
